# Builds every portfolio and publishes the combined site to GitHub Pages on each push to main.
name: Deploy portfolios to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # also allows a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Kushal's portfolio is a React + Vite app, so it must be built first.
      # --force: package.json pins a Windows-only rollup binary; this runner is Linux.
      - name: Build Kushal's portfolio
        working-directory: kushal
        run: |
          npm install --force --no-audit --no-fund
          npm run build

      # Landing page at the root, each portfolio in its own folder:
      #   /            -> site/        (team page, reads team.json)
      #   /kushal/     -> kushal/dist/
      #   /<name>/     -> members/<name>/   (plain HTML portfolios, copied as-is)
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r kushal/dist _site/kushal
          for dir in members/*/; do
            cp -r "$dir" "_site/$(basename "$dir")"
          done
          touch _site/.nojekyll
          find _site -maxdepth 2 | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
